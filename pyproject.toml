[project]
name = "oscars"
version = "0.1.0"
description = "Oscar nominations analysis: data collection from Wikipedia, IMDb and TMDb"
authors = [
    { name = "A-spira", email = "aspira@albertschool.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
    "types-requests>=2.33.0.20261006",
    "types-tqdm>=4.70.0.20260906",
]

# Ruff: lint + format for all project code (src/ and tests/). No rule is ignored globally.
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]          # first-party packages for import sorting (rule I)
include = ["src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]  # pycodestyle, pyflakes, isort, pyupgrade, bugbear

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = true

# mypy: type-check all project code with the stricter options below.
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
