[project]
name = "oscars"
version = "0.1.0"
description = "Oscar nominations analysis: data collection from Wikipedia, IMDb and TMDb"
authors = [
    { name = "A-spira", email = "aspira@albertschool.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.3",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
